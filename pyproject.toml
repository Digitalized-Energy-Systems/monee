[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monee"
version = "2.0.0"
authors = [
  { name="Rico Schrage", email="rico.schrage@uol.de" },
]
description = "Framework for calculating the steady-state energy flow and for solving optimization problems in coupled energy grids (gas, heat, electricity)"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]
license = "MIT"
dependencies = [
    "scipy>=1.10.1",
    "casadi>=3.6",
    "gekko>=1.3.2",
    "networkx>=3.0",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "geopy>=2.4.1",
    "plotly>=6.3.0",
    "pyscipopt>=5.0",
    "pyomo>=6.7"
]

[project.optional-dependencies]
plot = [
    "kaleido",
]
simbench = [
    "simbench>=1.6.1",
    "pandapower>=3.3.3",
]
test = [
    "pytest",
    "pytest-cov",
    "pre-commit",
    # pip wheel ships a size-limited licence (2000 vars/constraints, no licence
    # file needed); every gurobipy test model is tiny, so this lights up the
    # native-Gurobi backend tests in CI.
    "gurobipy",
]
testpp = [
    "pytest",
    "simbench==1.6.1",
    "pandapower==3.3.3",
    "pandapipes==0.14.0",
    "numpy==2.3.5",
    "pytest-cov",
    "pre-commit",
    "pandas==2.3.3",
    "kaleido",
    "gurobipy",
]

[project.urls]
Homepage = "https://monee.readthedocs.io"
Repository = "https://github.com/Digitalized-Energy-Systems/monee"
Issues = "https://github.com/Digitalized-Energy-Systems/monee/issues"

[tool.pytest.ini_options]
addopts = "-m 'not benchmark'"
markers = [
    "pptest: marks tests as dependant on pandapower",
    "benchmark: marks performance comparison tests (skipped by default unless selected via -m benchmark)",
]

[tool.coverage.run]
omit = ["tests/*"]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E", "F", "G", "I", "UP", "AIR", "PIE", "PLR1714", "PLW2901", "TRY201"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "I001", # allow unsorted imports in __init__.py
    "F401", # allow unused imports in __init__.py
    "E402", # __init__ interleaves computed aliases with imports
]
"benchmarks/*" = [
    "E402", # scripts suppress warnings / patch compat before heavy imports
]
"examples/*" = [
    "ARG",  # allow unused arguments
    "F841", # allow unused local variables
]
"tests/*" = [
    "ARG",  # allow unused arguments for pytest fixtures
    "E741", # allow reused variables
    "F841", # allow unused local variables
]
