# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: ubuntu-24.04
  apt_packages:
    # Chromium dependency pulled in by mermaid-cli (puppeteer) for PDF rendering.
    - libasound2t64
  tools:
    python: "3.12"
    nodejs: "20"
  jobs:
    post_install:
      # Mermaid diagrams render client-side in HTML, but the PDF builder needs
      # mermaid-cli (mmdc) to rasterise them.
      - npm install -g @mermaid-js/mermaid-cli

# Build documentation in the docs/ directory with Sphinx
sphinx:
   configuration: docs/source/conf.py

# Optionally build your docs in additional formats such as PDF
formats:
   - pdf

python:
   install:
   - requirements: docs/requirements.txt
