  - id: thermal-inertia
    group: horizon
    title: Thermal inertia
    short: Inertia
    level: advanced
    carriers: [heat]
    tagline: >-
      Give heating junctions thermal mass so temperature changes travel with delay.
    details: >-
      `LumpedThermalCapacitance` gives each water junction the thermal mass of its adjacent half-pipes,
      so a supply temperature step reaches downstream junctions with a delay and a rounded front.
      It adds no equations in a single solve and acts in timeseries, `Stepper` and multi-period
      runs. `default_t_init` and `t_init_overrides` anchor the first step, and the horizon should
      span a few time constants, which for realistic pipes are hours.
    highlights:
      - No per-junction parameters needed
      - Junctions with an external grid or grid-forming source are skipped
      - The time constant is roughly the stored water mass over the through-flow
    snippet: |-
      from monee import LumpedThermalCapacitance

      net.add_extension(LumpedThermalCapacitance())
    api:
      - monee.LumpedThermalCapacitance
      - monee.model.Network.add_extension
