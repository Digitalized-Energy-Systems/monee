  - id: stepper
    group: simulate
    title: Co-simulation Stepper
    short: Stepper
    level: advanced
    carriers: [all]
    tagline: >-
      Advance a network step by step from an external clock, with persistent state and outages.
    details: >-
      `Stepper` lets an external framework such as mosaik own the clock: each `step(dt_h)` solves
      one snapshot at the caller's step length, applies a profile row (`ts_index`) and then `data_overrides`,
      and carries storage, linepack and thermal state between calls. Components can be failed,
      restored, deactivated, activated or removed between steps, and every topology change is
      logged as a `NetworkChange`. By default successful steps warm-start the next solve, and
      `to_timeseries_result` converts the history to the usual result API.
    highlights:
      - '`dt_h` may change on every call'
      - >-
        `changes_df` lists every topology change, including islanding decided in the solve
      - >-
        `on_step_error="skip"` keeps the clock in sync and carries a failed step's interval forward
      - '`max_history` bounds memory in open-ended runs'
    snippet: |-
      from monee import Stepper

      c = Stepper(net, timeseries_data=td)
      r = c.step(1.0, ts_index=0)
      r2 = c.step(0.25, ts_index=1, data_overrides={(load_id, "p_mw"): 0.3})
    api:
      - monee.Stepper
      - monee.simulation.Stepper.step
      - monee.simulation.Stepper.get
