  - id: islanding
    group: simulate
    title: Islanding
    short: Islands
    level: advanced
    carriers: [electricity, gas, heat]
    tagline: Solve networks split into islands, each led by its own grid-forming unit.
    details: >-
      `enable_islanding` registers per-carrier modes for electricity, gas and water that add a
      connectivity-flow formulation with binary energization variables, so every island holding
      a grid-forming unit is solved instead of pruned. A grid-forming generator or source leads
      an island only once that island has lost its external grid; elsewhere a generator holds its
      nominal setpoint (idle by default) and a source's flow stays free unless a nominal is set.
      An island short of capacity de-energizes buses instead of failing, and the binaries
      need a mixed-integer solver such as SCIP or Gurobi.
    highlights:
      - >-
        Grid-forming generators for electricity, grid-forming sources for gas and water
      - >-
        `branch_gating` takes the branches of a de-energized bus out of service, so a unit serves
        as many buses as its capacity covers
      - Call `enable_islanding` again after loading a saved network
    snippet: |-
      import monee as mn
      import monee.express as mx

      mx.create_grid_forming_generator(net, bus_2, p_mw_max=1.0, q_mvar_max=0.5)
      mn.enable_islanding(net, electricity=True)
      result = mn.run_energy_flow(net, solver="scip")
