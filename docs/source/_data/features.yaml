  - id: express-builder
    group: build
    title: Express builder
    short: Express
    level: core
    carriers: [all]
    tagline: Add any component with one `create_*` call that returns its id.
    details: >-
      `monee.express` (imported as `mx`) has dedicated `create_*` functions for buses, lines,
      transformers, loads, generators, external grids, gas and water junctions and pipes, compressors,
      sources, sinks, heat exchangers and coupling units, plus generic `create_el_child`, `create_gas_child`
      and `create_water_child` for any other child model such as a storage. Branch and child functions
      on a single carrier auto-create a missing endpoint, an optional `name` makes a component
      addressable in results and time series, and `position` places nodes in plots. `mx.create_multi_energy_network()`
      is an alias for `mm.Network()`, so express calls and the model API mix freely.
    highlights:
      - One call per component for electricity, gas, heat and coupling units
      - Every `create_*` call returns the component id
      - '`name=` makes a component addressable in time series and results'
      - '`constraints=` on every call, explicit node and child ids via `overwrite_id`'
    snippet: |-
      import monee.express as mx
      net = mx.create_multi_energy_network()
      b0, b1 = mx.create_bus(net), mx.create_bus(net)
      mx.create_line(net, b0, b1, length_m=100, r_ohm_per_m=7e-5, x_ohm_per_m=7e-5)
      mx.create_ext_power_grid(net, b0)
      mx.create_power_load(net, b1, p_mw=0.1, q_mvar=0.0)
