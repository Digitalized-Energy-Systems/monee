  - id: gas-linepack
    group: horizon
    title: Gas linepack
    short: Linepack
    level: advanced
    carriers: [gas]
    tagline: Let gas pipelines store and release mass to buffer demand over time.
    details: >-
      `GasLinepack` gives every gas pipe a stored mass tied to its average pressure and a net
      pack rate split equally between its end junctions. A single solve pins the pack rate to
      zero; in timeseries, `Stepper` and multi-period runs the stored mass couples consecutive
      steps, and a multi-period optimization can pack the line at low demand and drain it in the
      peak. Capacities are computed from pipe geometry and the gas grid and can be overridden
      per pipe.
    highlights:
      - In a joint solve, lowers the feed-in capacity a demand peak needs
      - '`linepack_kg_initial` and `linepack_kg_max` override per pipe'
      - Combines with `LumpedThermalCapacitance`
    snippet: |-
      from monee import GasLinepack

      net.add_extension(GasLinepack())
    api:
      - monee.GasLinepack
      - monee.model.Network.add_extension
