  - id: custom-formulations
    group: extend
    title: Custom formulations
    short: Own equations
    level: advanced
    carriers: [all]
    tagline: >-
      Write your own equation sets for any model type and run them on every backend.
    details: >-
      Subclass `NodeFormulation`, `BranchFormulation`, `ChildFormulation` or `CompoundFormulation`,
      declare variables in `ensure_var` and return constraints from `equations` (optionally objective
      terms from `minimize`), then map the classes to model types in a `NetworkFormulation`. The
      backend injects math implementations and a piecewise builder, so the same formulation runs
      on every backend. Activate it with `Network.apply_formulation`, the `formulation=` keyword
      of a builder or solve call, or by name after `register_formulation`.
    highlights:
      - Map per model type or per (model, grid) pair
      - >-
        Mix with built-ins by key, for example `formulation=("smooth_nlp", "my_key")`
      - >-
        A per-component pin overrides the solve argument and the network-level choice
    snippet: |-
      from monee.model.formulation import NetworkFormulation

      form = NetworkFormulation(branch_type_to_formulations={LinearValve: LinearValveFormulation()})
      monee.register_formulation("linear_valve", form)
      result = monee.run_energy_flow(net, formulation=("smooth_nlp", "linear_valve"))
    api:
