  - id: coupler-regulation
    group: couple
    title: Coupler dispatch
    short: Regulation
    level: advanced
    carriers: [all]
    tagline: >-
      Run any coupler, load or generator between off and its full setpoint, as a fixed share or as
      an optimization decision.
    details: >-
      Every child, coupler and heat exchanger carries a regulation factor between 0 and 1 that
      scales its setpoint; a plain energy flow keeps it at its set value (1 by default), and a
      timeseries can drive it for part load. An optimization problem promotes it to a decision
      variable: `controllable_cps` does this for every coupler, and load shedding and economic
      dispatch do it for you. Result frames keep the setpoint column and report regulation next
      to it, so the served quantity is their product.
    highlights:
      - A plain energy flow delivers regulation times the setpoint exactly
      - '`controllable_cps` turns every coupler''s regulation into a decision'
      - Drive part load from a profile with a regulation series
      - Setpoint and served value stay apart in the results
    snippet: |-
      problem = mp.OptimizationProblem()
      problem.controllable_cps([("regulation", mp.AttributeParameter(
          min=lambda a, v: 0, max=lambda a, v: 1, val=lambda a, v: 1))])
    api:
      - monee.problem.OptimizationProblem.controllable_cps
      - monee.problem.AttributeParameter
      - monee.simulation.TimeseriesData.add_compound_series_by_name
    keywords: [regulation, dispatch, part load, controllable, decision variable, setpoint, served,
      coupling point]
