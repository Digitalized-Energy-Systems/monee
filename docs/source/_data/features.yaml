  - id: timeseries
    group: simulate
    title: Timeseries
    short: Timeseries
    level: core
    carriers: [all]
    tagline: >-
      Replay profiles step by step as independent solves, each a power flow or an optimization.
    details: >-
      `run_timeseries` copies the network for each step, applies the registered profiles and solves
      the steps one after another, so run time grows linearly with their number. Pass `optimization_problem`
      to optimize each step on its own; ramp and storage limits then act against the step just
      solved, with no foresight. `StepHook` subclasses run code before and after every step, `on_step_error="skip"`
      records failed steps and keeps going. A plain CasADi power flow driven by id-addressed series,
      without step hooks, extra solver options or temporal coupling, builds the model once and
      re-solves it per step.
    highlights:
      - '`get_result_for` returns one row per step and one column per component'
      - >-
        `dt_h` sets a constant step length, a `datetime_index` derives it from timestamps
      - Step hooks raise alerts, log, or read and write inter-step state
      - >-
        Switch to `run_multi_period` only when storage, ramps, linepack, inertia or a terminal
        state must be planned jointly
    snippet: |-
      from monee.simulation import TimeseriesData, run_timeseries

      td = TimeseriesData()
      td.add_child_series(load_id, "p_mw", [0.4, 0.6, 1.0, 1.2, 0.9, 0.5])
      result = run_timeseries(net, td)
