        label: Ramp-limited generator model
        kind: how-to
      - doc: how-to/timeseries
        section: Prescribed replay semantics
        label: Prescribed replay semantics
        kind: how-to
      - doc: concepts/multi_period
        section: PeriodState
        label: PeriodState
        kind: concept
      - doc: api/monee.simulation
        section: Step state
        label: Step state API
        kind: api

