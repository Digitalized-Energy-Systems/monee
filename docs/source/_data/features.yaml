  - id: misocp-relaxation
    group: solve
    title: MISOCP relaxation
    short: MISOCP
    level: advanced
    carriers: [electricity]
    tagline: >-
      Second-order cone relaxation of AC power flow for convex, global and mixed-integer studies.
    details: >-
      `EL_MISOCP_FORMULATION` lifts voltages and currents into squared variables and relaxes the
      branch-flow coupling into a second-order cone, a convex model that SCIP or Gurobi solve
      to global optimality. The branch frame reports the series flows so you can check the cone
      gap, and `result.warnings` carries a relaxation finding when a cone stays slack. Because
      a relaxation keeps every feasible point, its optimum is a lower bound that grades any dispatch
      found by a local solver.
    highlights:
      - >-
        Branch currents, loading limits and pi-model charging included; transformer phase shift
        is ignored
      - '`EL_NONCONVEX_MIQCQP_FORMULATION` pins the cone to equality for exact AC'
      - >-
        On radial networks a tight cone certifies an exact AC power flow; on meshed ones cross-check
        with an NLP solve
    snippet: |-
      import monee

      net.apply_formulation(monee.EL_MISOCP_FORMULATION)
      result = monee.solve(net, solver="scip")
    api:
      - monee.EL_MISOCP_FORMULATION
      - monee.EL_NONCONVEX_MIQCQP_FORMULATION
      - monee.ResultWarning
