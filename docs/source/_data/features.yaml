        section: ''
        label: Water and heat components
        kind: component
      - doc: concepts/domains
        section: Temperature propagation
        label: Temperature propagation
        kind: concept
      - doc: concepts/multi_energy
        section: Fixed-flow and passive exchangers
        label: Fixed-flow and passive exchangers
        kind: concept
      - doc: how-to/district_heating
        section: Part-load control
        label: Part-load control
        kind: how-to
      - doc: api/monee.model.phys
        section: Heat flow
        label: Heat physics API
        kind: api

  - id: edit-and-switch
    group: model
    title: Edit and switch components
    short: Edit
    level: advanced
    carriers: [all]
    tagline: >-
      Change parameters, take components out of service, remove or replace them, and copy networks.
    details: >-
      Declared attributes such as setpoints, cost, `diameter_m` or `on_off` are settable between
      solves, and `Network.deactivate` and `activate` exclude components without deleting them,
      propagating through compound parts. Every add has a removal counterpart, so replacing a
      pipe is a removal plus a new create call, and `Network.copy` gives a fast deep copy for
      scenario loops. Writing an unknown attribute warns, and `set_attribute_guard("error")` or
      `MONEE_ATTRIBUTE_GUARD=error` turns typos into errors for CI.
    highlights:
      - Look up components with `node_by_id`, `branch_by_id` and `child_by_id`
      - >-
        `deactivate` switches a CHP off cleanly and restores its setpoints on `activate`
      - >-
        `remove_child`, `remove_node`, `remove_branch` and `remove_compound` undo any add
      - >-
        Sizing arguments live in `Var` bounds, so a bigger battery is `storage.e_mwh.max = 4.0`
    snippet: |-
      from monee.model.core import set_attribute_guard

      set_attribute_guard("error")
      net.child_by_id(load_id).model.p_mw = 1.2
      net.deactivate(net.child_by_id(gen_id))
      result = monee.run_energy_flow(net.copy())
    api:
      - monee.model.Network.deactivate
      - monee.model.Network.activate
      - monee.model.Network.deactivate_by_id
      - monee.model.Network.remove_child
      - monee.model.Network.remove_node
      - monee.model.Network.remove_branch
      - monee.model.Network.remove_compound
      - monee.model.Network.copy
      - monee.model.Network.node_by_id
      - monee.model.Network.branch_by_id
      - monee.model.Network.child_by_id
      - monee.model.core.set_attribute_guard
    keywords: [parameter study, sweep, what-if, deactivate, out of service, contingency, remove,
      copy, attribute guard, typo]
    related: [network-model, stepper, islanding, load-shedding, resilience-metrics]
    docs:
      - doc: concepts/data_model
        section: Which attributes are settable after construction
        label: Settable attributes
        kind: concept
      - doc: concepts/conventions
        section: Removing components
        label: Removing components
        kind: concept
      - doc: how-to/express_structures
        section: 'Parameter studies: editing what a structure built'
        label: Parameter studies
        kind: how-to
      - doc: concepts/conventions
        section: Writing attributes after construction
        label: Writing attributes
        kind: concept
      - doc: concepts/data_model
        section: Component ids
        label: Component ids
        kind: concept

  - id: power-to-heat
    group: couple
    title: Power-to-heat
    short: P2H
    level: core
    carriers: [electricity, heat]
    tagline: >-
      Heat pumps and electric boilers that draw power from a bus and heat a water loop.
    details: >-
      `create_p2h` adds a `PowerToHeat` compound whose internal heat exchanger heats water from
      the cold inlet to the hot outlet; the electrical draw follows as heat output divided by
      efficiency, and an efficiency above 1 models a heat pump with a fixed COP. Name the sides
      with `cold_node_id` and `hot_node_id` to make the wiring explicit. Results appear on the
      `PowerToHeatControlNode` as `el_mw` (consumption, positive) and `heat_mw` (injection, negative).
    highlights:
      - Efficiency above 1 models a heat pump COP
      - Electric boilers and heat pumps share one component
      - Acts as a feed-in station from return to supply header
      - '`PowerToHeatHG` injects heat at one junction instead'
    snippet: |-
      mx.create_p2h(net, power_node_id=bus, cold_node_id=j_return,
                    hot_node_id=j_supply, heat_energy_mw=0.5, diameter_m=0.1,
                    efficiency=3.0)
    api:
      - monee.express.create_p2h
      - monee.model.PowerToHeat
      - monee.model.PowerToHeatControlNode
    keywords: [P2H, power-to-heat, heat pump, heatpump, electric boiler, COP, electrification, sector coupling]
    related: [chp, gas-to-heat, heat-loops, energy-flow, node-based-couplers]
    docs:
      - doc: quickstart
        section: Multi-energy networks
        label: 'Quickstart: couple power and heat'
        kind: quickstart
      - doc: concepts/multi_energy
        section: Power-to-Heat (P2H)
        label: Power-to-heat
        kind: concept
      - doc: components/coupling
        section: PowerToHeat
        label: PowerToHeat reference
        kind: component
      - doc: how-to/district_heating
        section: ''
        label: District heating with couplers
        kind: how-to

  - id: chp
    group: couple
    title: CHP
    short: CHP
    level: core
    carriers: [electricity, gas, heat]
    tagline: >-
      Combined heat and power units that burn gas and feed electricity and district heat.
    details: >-
      `create_chp` adds a compound with separate power and heat efficiencies and a gas consumption
      setpoint, connected to a bus, a gas junction and a cold and a hot water junction. Its internal
      exchanger heats water by the 30 K design spread, so wired from the return to the supply
      header it acts as a feed-in station that holds the supply temperature. Give its gas side
      a gas external grid as pressure reference, and deactivate the compound to switch the unit
      off cleanly.
    highlights:
      - Keep `efficiency_power` plus `efficiency_heat` at or below 1
      - >-
        `CHPControlNode` reports `el_mw`, `heat_mw` and the gas setpoint `gas_mass_flow_kgs`
      - >-
        Regulation becomes a decision in economic dispatch once gas and heat are priced
    snippet: |-
      mx.create_chp(net, power_node_id=bus, gas_node_id=j_gas,
                    cold_node_id=j_return, hot_node_id=j_supply, diameter_m=0.15,
                    efficiency_power=0.35, efficiency_heat=0.45,
                    mass_flow_setpoint_kgs=0.05)
    api:
      - monee.express.create_chp
      - monee.model.CHP
      - monee.model.CHPControlNode
    keywords: [CHP, cogeneration, combined heat and power, gas engine, feed-in station, sector
        coupling]
    related: [power-to-heat, heat-loops, coupler-regulation, economic-dispatch, node-based-couplers]
    docs:
      - doc: concepts/multi_energy
        section: Combined Heat and Power (CHP)
        label: Combined heat and power
        kind: concept
      - doc: components/coupling
        section: CHP
        label: CHP reference
        kind: component
      - doc: tutorials/03_coupled_network
        section: ''
        label: 'Tutorial: coupled network'
        kind: tutorial
      - doc: problems/economic_dispatch
        section: Gas and heat
        label: CHP in economic dispatch
        kind: problem
      - doc: api/monee.model
        section: Multi-energy couplers
        label: Couplers API
        kind: api

  - id: gas-to-heat
    group: couple
    title: Gas boilers
    short: G2H
    level: advanced
    carriers: [gas, heat]
    tagline: Gas boilers that feed district heat without producing electricity.
    details: >-
      `create_g2h` adds a `GasToHeat` compound with a heat setpoint and an efficiency, wired into
      the loop like CHP and P2H with a cold inlet and a hot outlet. It draws `heat_energy_mw /
      (efficiency * 3.6 * hhv)` kg/s of gas, using the gas grid's higher heating value. The `GasToHeatControlNode`
      reports `heat_mw` (heat injected) and `gas_mass_flow_kgs` (the fuel setpoint; the served
      draw is regulation times it).
    highlights:
      - Heat only, no electricity output
      - Same cold-to-hot wiring as CHP and P2H
      - Needs a gas external grid as pressure reference
      - '`GasToHeatHG` is a node-based variant'
    snippet: |-
      mx.create_g2h(net, gas_node_id=j_gas, cold_node_id=j_return,
                    hot_node_id=j_supply, heat_energy_mw=0.5, diameter_m=0.1,
                    efficiency=0.9)
    api:
      - monee.express.create_g2h
      - monee.model.GasToHeat
      - monee.model.GasToHeatControlNode
    keywords: [G2H, gas-to-heat, gas boiler, peak boiler, district heating, sector coupling]
    related: [chp, power-to-heat, heat-loops, gas-network]
    docs:
      - doc: concepts/multi_energy
        section: Gas-to-Heat (G2H)
        label: Gas-to-heat
        kind: concept
      - doc: components/coupling
        section: GasToHeat
        label: GasToHeat reference
        kind: component
      - doc: how-to/district_heating
        section: ''
        label: District heating with couplers
        kind: how-to

  - id: power-gas-links
    group: couple
    title: Electrolysers and turbines
    short: P2G / G2P
    level: advanced
    carriers: [electricity, gas]
    tagline: >-
      Power-to-gas electrolysers and gas-to-power turbines as single branches between bus and
      junction.
    details: >-
      `create_p2g` adds a `PowerToGas` branch from a bus to a gas junction that injects a gas
      mass flow setpoint and draws the matching electric power at its efficiency. `create_g2p`
      adds a `GasToPower` branch from a gas junction to a bus that injects active and reactive
      power setpoints and draws the matching gas flow through the gas grid's higher heating value.
      Both are plain branches that report their results on the branch itself and dispatch through
      regulation.
    highlights:
      - P2G reports `p_from_mw` (power drawn) and `to_mass_flow_kgs` (gas injected)
      - G2P takes `p_mw_setpoint` and `q_mvar_setpoint`
      - '`loss_percent()` returns 1 minus the efficiency'
      - A rated cable can curtail an electrolyser in economic dispatch
    snippet: |-
      mx.create_p2g(net, from_node_id=bus, to_node_id=j_gas, efficiency=0.7,
                    mass_flow_setpoint_kgs=0.01)
      mx.create_g2p(net, from_node_id=j_gas, to_node_id=bus, efficiency=0.4,
                    p_mw_setpoint=0.5)
    api:
      - monee.express.create_p2g
      - monee.express.create_g2p
