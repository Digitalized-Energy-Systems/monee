  - id: multi-period
    group: horizon
    title: Multi-period
    short: Horizon
    level: core
    carriers: [all]
    tagline: >-
      Optimize a whole horizon jointly when storage, ramps, linepack or inertia couple the periods.
    details: >-
      `run_multi_period` builds one problem over all periods, so decisions anticipate the horizon:
      a battery charges cheaply now to cover a later peak. It is only needed when something couples
      periods; independent periods are cheaper with `run_timeseries`. `initial_state` and `terminal_state`
      pin the start and end, periods may differ in length through a `dt_h` list or a `DatetimeIndex`,
      and CasADi with IPOPT is the default while Pyomo with SCIP or Gurobi handles integer problems.
    highlights:
      - '`terminal_state` fixes the final value, for example for cyclic storage'
      - Built-in and custom problems run unchanged over the horizon
      - '`MultiPeriodResult` offers per-period frames and `get_period_result`'
      - 'Periods carry no time weight: scale prices by `dt_h` for energy cost'
    snippet: |-
      from monee.simulation import run_multi_period

      result = run_multi_period(net, td, optimization_problem=prob, dt_h=1.0,
                                terminal_state={(bat, "e_mwh"): 2.0})
      soc = result.get_result_for_id(bat, "e_mwh")
    api:
      - monee.run_multi_period
      - monee.MultiPeriodResult
      - monee.simulation.MultiPeriodResult.get_period_result
      - monee.PyomoMultiPeriodSolver
