  - id: ac-opf
    group: optimize
    title: AC optimal power flow
    short: AC OPF
    level: advanced
    carriers: [electricity]
    tagline: >-
      Turn MATPOWER or pandapower cases with generator costs into a cost-minimizing AC OPF.
    details: >-
      `read_matpower_opf_case` returns a network and an `OptimizationProblem`: every in-service
      generator is dispatchable within its active and reactive limits with its polynomial cost,
      bus voltages stay in their band and `max_loading` caps branch loading. `from_pandapower_net(net,
      opf=True)` takes the same route with `poly_cost` and the pandapower limits. The slack voltage
      is free within its band, the OPF convention of MATPOWER and pandapower, and the pandapower
      `case9` matches `runopp` to about 1e-5 MW.
    highlights:
      - '`limit_basis` selects apparent-power (default) or current loading limits'
      - Piecewise-linear `gencost` only with two breakpoints, that is a linear cost
      - pandapower static generators stay fixed injections under `opf=True`
      - >-
        Switch to the MISOCP relaxation and solve with SCIP or Gurobi for a convex variant
    snippet: |-
      import monee
      from monee.io.matpower import read_matpower_opf_case

      net, problem = read_matpower_opf_case("case9.m", max_loading=1.0)
      result = monee.run_energy_flow_optimization(net, problem)
    api:
      - monee.io.matpower.read_matpower_opf_case
