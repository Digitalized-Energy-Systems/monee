  - id: load-shedding
    group: optimize
    title: Load shedding
    short: Shedding
    level: core
    carriers: [all]
    tagline: >-
      Find the least harmful curtailment across electricity, gas and heat after a contingency.
    details: >-
      `create_min_load_shedding_problem` gives every demand, generator and coupling unit a service
      level between 0 and 1 and minimizes weighted unserved power under the full physics and bounds
      on voltage, pressure, temperature, loading and external exchange. `solve_load_shedding_problem`
      builds and solves it in one call, `weight_for_load` ranks critical loads so they are shed
      last, and reserve lines built with `backup=True` become switch decisions. Those switches
      are binary only on a mixed-integer solver such as SCIP or Gurobi; IPOPT relaxes them.
    highlights:
      - Per-load priorities through `weight_for_load`
      - Exchange bounds per carrier at external grids, the heat slack included
      - A shed-headroom check warns when a slack could still import more
      - Lexicographic variant on the Pyomo and native Gurobi backends
    snippet: |-
      from monee import solve_load_shedding_problem

      result = solve_load_shedding_problem(
          network, bounds_vm=(0.9, 1.1), bounds_ext_el=(-0.5, 0.5))
