    title: Energy flow
    short: Energy flow
    level: core
    carriers: [all]
    tagline: >-
      Solve power, gas and heat flows of one network as one simultaneous steady-state system.
    details: >-
      `run_energy_flow` writes the equations of every carrier into one model and solves them together,
      so a coupled network needs no iteration between sectors. It runs as a square steady-state
      simulation: phantom degrees of freedom are pinned and operational flow limits dropped, while
      `run_energy_flow_optimization` solves the same model under an optimization problem's limits
      and objective. monee uses IPOPT by default (via CasADi), and the solved values are written
      back into the network as a warm start unless you pass `copy=True`.
    highlights:
      - >-
        AC power flow, Weymouth gas flow and Darcy-Weisbach water and heat flow in one solve
      - One formulation serves both simulation and optimization
      - '`formulation="smooth_nlp"` gives a binary-free model for IPOPT'
      - >-
        `result.success`, `termination_condition` and `residuals` report how the solve ended
