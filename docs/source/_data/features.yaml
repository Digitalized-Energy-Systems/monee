  - id: optimization-problems
    group: optimize
    title: Custom problems
    short: Problems
    level: core
    carriers: [all]
    tagline: >-
      Declare decisions, objectives and constraints, then solve them with the network physics.
    details: >-
      An `OptimizationProblem` collects what the solver may change (`controllable_generators`,
      `controllable_demands`, `controllable_cps`, `controllable_storages`, or any attribute through
      `controllable`), plus `Objectives` and `Constraints` built over selected components; `Network.constraint`
      and `Network.objective` add rows over the whole network. The same problem object runs in
      `run_energy_flow_optimization`, `run_timeseries`, `run_multi_period`, `run_mpc` and the
      `Stepper`. With `lex_objectives=True`, a single-period solve on Pyomo or gurobipy minimizes
      your objective first and the formulation's tightening terms second, with no weights to tune.
    highlights:
      - '`bounds` overrides the limits of selected variables after promotion'
      - The built-in problems are assembled from the same public pieces
      - Lexicographic objectives remove weight tuning against relaxation terms
      - '`result.user_objective` reports your objective without the auxiliary terms'
    snippet: |-
      import monee, monee.model as mm, monee.problem as mp
      problem = mp.OptimizationProblem()
      problem.controllable_generators(["p_mw"])
      problem.objectives = mp.Objectives()
      problem.objectives.select(lambda m, _c: isinstance(m, mm.PowerGenerator)).calculate(lambda ms: sum(m.cost * -m.p_mw for m in ms))
      result = monee.run_energy_flow_optimization(net, problem)
    api:
