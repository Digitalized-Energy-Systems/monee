  - id: custom-models
    group: extend
    title: Custom components
    short: Custom models
    level: advanced
    carriers: [all]
    tagline: Subclass a model, write its equations and register it with `@mm.model`.
    details: >-
      Subclass `NodeModel`, `BranchModel`, `ChildModel` or `CompoundModel` (or the `MultiGrid`
      node, branch and compound variants that span carriers) and return constraint expressions
      from `equations()`. `Var` marks a decision variable, `Const` a pinned setpoint, `Intermediate`
      a solver-computed value and `PostProcess` a report-only value, and the branch author contract
      lists the attributes the nodal balances read. The `@mm.model` decorator registers the class
      so it round-trips through the native OMEF format.
    highlights:
      - >-
        Keep `Var` for quantities an equation pins or a problem drives; use `Const` or a float
        for setpoints
      - >-
        An unpinned `Var` is a free degree of freedom in simulation, and the result warns about
        it
      - >-
        Per-component `constraints=` callables add extra constraints without subclassing
    snippet: |-
      @mm.model
      class FlexibleLoad(mm.PowerLoad):
          def __init__(self, c, **kwargs):
              super().__init__(mm.Var(c, min=0, max=c), mm.Var(0), **kwargs)
          def equations(self, grid, node_model, **kwargs):
              return [self.q_mvar == 0]
    api:
