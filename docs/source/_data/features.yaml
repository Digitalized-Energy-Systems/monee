  - id: mccormick-heat
    group: solve
    title: Linear district heating (McCormick)
    short: McCormick
    level: advanced
    carriers: [heat]
    tagline: >-
      Convex LP or MILP district heating with McCormick envelopes and computable worst-case gap
      bounds.
    details: >-
      `HEAT_CONVEX_MILP_FORMULATION` replaces the bilinear enthalpy with McCormick envelopes,
      linearizes the heat loss and omits hydraulics, so pipes are unidirectional. `num_partitions`
      above 1 tightens it into a piecewise MILP, and `mccormick_dhs_gap_bound_mw` and `mccormick_dhs_gap_bound_k`
      report the worst-case gap before you refine. Node-based heat loads and the HG couplers inject
      heat straight into its nodal heat balance, while heat exchangers map to fixed-flow convex
      variants.
    highlights:
      - An LP at `num_partitions=1`, a piecewise MILP above, for SCIP or Gurobi
      - Worst-case gap bounds in MW and K
      - >-
        `orient_unidirectional_water_pipes` re-orients pipes so every junction stays supplied
        after an outage
      - The economic dispatch cannot price heat under it
    snippet: |-
      import monee

      net.apply_formulation(monee.make_heat_convex_milp_formulation(num_partitions=4))
      result = monee.solve(net, solver="scip")
    api:
