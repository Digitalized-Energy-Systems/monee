# Feature catalog for the "Feature overview" page (features.md).
#
# This file is the single source of truth for the interactive feature map and
# the "What do you want to do?" task table. The local Sphinx extension
# _ext/feature_map.py reads it once per build, validates it and reports every
# problem as a normal Sphinx warning that points at the offending line here.
#
# groups    One line on the map each, drawn in "order". "style: open" draws a
#           hollow line (where user code plugs in). Colors are assigned by order.
#           The id "other" is reserved for features with an unknown group.
# features  One station each. Required: id, group, title, tagline, level
#           (core or advanced), carriers (electricity, gas, heat or all), docs.
#           Optional: short, details, highlights, snippet, api, keywords and
#           related (ids of other features, drawn as arcs on hover).
# tasks     One row of the task table each, grouped by "category" (a group
#           title, or a free category such as "Get started"). Ids start with
#           "task-". "features" are feature ids shown as chips.
# docs      Links into these docs: "doc" is a document name, "section" the
#           exact title of a heading or rubric on that page ("" links the page
#           itself), "kind" one of quickstart, install, concept, how-to,
#           tutorial, problem, component, benchmark or api. The extension
#           resolves them to URLs at build time, so they never go stale silently.
#
# Text fields may use `backticks` for inline code.

groups:
  - id: model
    title: Model the network
    order: 1
    tagline: One graph holds the components and physics of electricity, gas and heat.

  - id: couple
    title: Couple the carriers
    order: 2
    tagline: Conversion units link the grids so every carrier solves in one system.

  - id: build
    title: Build and import
    order: 3
    tagline: >-
      Create networks in code, import standard formats or start from ready-made systems.

  - id: simulate
    title: Simulate
    order: 4
    tagline: >-
      Steady-state energy flow, profile replay, co-simulation and islanded operation.

  - id: optimize
    title: Optimize
    order: 5
    tagline: Ready-made and custom problems, from one period to a coupled horizon.

  - id: horizon
    title: Plan a horizon
    order: 6
    tagline: >-
      What couples periods in time, and the joint and rolling solves that exploit it.

  - id: solve
    title: Formulate and solve
    order: 7
    tagline: Choose the equations and the solver that fit your study.

  - id: analyze
    title: Analyze and validate
    order: 8
    tagline: Read, plot, check and trust every result.

  - id: extend
    title: Extend
    order: 9
    style: open
    tagline: Add your own components, equations and network-wide plug-ins.

features:
  - id: network-model
    group: model
    title: Network data model
    short: Data model
    level: core
    carriers: [all]
    tagline: Nodes, branches, children and compounds form one graph across all carriers.
    details: >-
      monee stores a network as one graph of nodes (buses, junctions), oriented branches (lines,
      pipes), children (loads, sources, external grids) and compounds (multi-part units such as
      a CHP). The physics lives in a model object attached to each component, so models can be
      swapped without touching the topology. Use the express API for everyday building, `Network.node`,
      `branch`, `child` and `compound` for full control, and `statistics` or `as_dataframe_dict`
      to inspect what you built.
    highlights:
      - >-
        Every carrier lives in the same graph, with one grid object per carrier for shared constants
      - >-
        Compounds such as a CHP build their own internal nodes and branches and report on a control
        node
      - >-
        `statistics()` counts components per model class, `as_dataframe_dict()` lists every input
        as one `DataFrame` per class
      - >-
        `net.graph` is the underlying networkx `MultiGraph`; branch direction lives in the from
        and to ids
    snippet: |-
      import monee.model as mm

      net = mm.Network(el_model=mm.PowerGrid(name="power", sn_mva=1))
      load = net.child(mm.PowerLoad(p_mw=0.1, q_mvar=0.0))
      bus0 = net.node(mm.Bus(base_kv=1), child_ids=[load], grid=mm.EL)
      bus1 = net.node(mm.Bus(base_kv=1), grid=mm.EL)
      net.branch(mm.PowerLine(length_m=100, r_ohm_per_m=1e-4, x_ohm_per_m=1e-4, parallel=1), bus0, bus1, grid=mm.EL)
    api:
      - monee.model.Network
      - monee.model.Network.node
      - monee.model.Network.branch
      - monee.model.Network.child
      - monee.model.Network.compound
      - monee.model.Network.statistics
      - monee.model.Network.as_dataframe_dict
      - monee.model.Network.graph
      - monee.model.to_spanning_tree
      - monee.model.Node
      - monee.model.Branch
      - monee.model.Child
      - monee.model.Compound
    keywords: [network, graph, node, branch, child, compound, bus, junction, topology, statistics,
      inventory, networkx, spanning tree]
    related: [express-builder, carrier-grids, edit-and-switch, custom-models, result-tables]
    docs:
      - doc: concepts/data_model
        section: ''
        label: Data model
        kind: concept
      - doc: concepts/data_model
        section: Assembling a network
        label: Assembling a network
        kind: concept
      - doc: concepts/data_model
        section: Network conveniences
        label: Inspect and transform a network
        kind: concept
      - doc: components/index
        section: ''
        label: Component reference
        kind: component
      - doc: api/monee.model
        section: Network container
        label: Network API
        kind: api

  - id: carrier-grids
    group: model
    title: Carrier grids
    short: Grids
    level: advanced
    carriers: [all]
    tagline: >-
      Set the per-unit bases, gas type, reference pressure and limits of each energy carrier.
    details: >-
      Each carrier has a grid object: `PowerGrid` holds the apparent-power base and voltage band,
      `GasGrid` the fluid preset (`lgas` or `methane`), reference pressure and squared-pressure
      band, and `WaterGrid` the reference temperature, velocity cap and fluid properties. Pass
      grids to `Network` by keyword as `el_model`, `gas_model` and `water_model`. Voltage levels come
      from each bus's `base_kv`, so one power grid covers a multi-level network; a second grid instance
      is only needed for a different per-unit base, and the branch that joins the two then needs
      the same explicit `grid=`. Build a new grid rather than
      editing one, because derived constants such as compressibility are computed at construction.
    highlights:
      - >-
        Gas presets `lgas` and `methane`, with absolute or gauge pressure via `pressure_ambient_pa`
      - >-
        Voltage levels come from `base_kv` on each bus, so one `PowerGrid` covers HV and MV
      - >-
        Gas pressure bands apply in optimization runs only, so a plain simulation stays square
      - >-
        `WaterGrid` sets `t_ref_k`, `pressure_ref_pa` and the velocity cap `v_max_mps`
    snippet: |-
      import monee.model as mm

      net = mm.Network(el_model=mm.create_power_grid("el", sn_mva=100),
                       gas_model=mm.create_gas_grid("gas", type="methane"))
      hv = net.node(mm.Bus(base_kv=110), grid=mm.EL)
      mv = net.node(mm.Bus(base_kv=20), grid=mm.EL)
    api:
      - monee.model.PowerGrid
      - monee.model.GasGrid
      - monee.model.WaterGrid
      - monee.model.create_power_grid
      - monee.model.create_gas_grid
      - monee.model.create_water_grid
      - monee.model.STANDARD_ATMOSPHERE_PA
    keywords: [grid, sn_mva, per unit, base, voltage level, pressure stage, lgas, methane, gauge
        pressure, reference temperature]
    related: [network-model, electricity-grid, gas-network, district-heating, conventions]
    docs:
      - doc: components/grids
        section: ''
        label: Grids reference
        kind: component
      - doc: concepts/data_model
        section: Grids
        label: Grids in the data model
        kind: concept
      - doc: concepts/conventions
        section: Gas
        label: Gas pressure convention
        kind: concept
      - doc: how-to/express_structures
        section: Builders and their defaults
        label: Build a medium-pressure gas grid
        kind: how-to
      - doc: api/monee.model
        section: Grids
        label: Grids API
        kind: api

  - id: electricity-grid
    group: model
    title: Electricity grid
    short: Power grid
    level: core
    carriers: [electricity]
    tagline: >-
      Buses, lines, transformers, loads, generators and shunts solved with full AC power flow.
    details: >-
      Buses hold voltage magnitude and angle; `PowerLine`, `Trafo` and the MATPOWER-style `GenericPowerBranch`
      connect them, and `ExtPowerGrid` is the slack. Loads, PQ generators, voltage-controlled
      generators (PV buses) and constant-admittance shunts attach as children. The default formulation
      is the nonlinear polar AC power flow, which handles any topology and is validated against
      pandapower.
    highlights:
      - >-
        Polar AC power flow in voltage magnitude and angle, for radial and meshed grids
      - >-
        Branch results report flows at both ends and loading against `max_i_ka`; losses are `p_from_mw
        + p_to_mw`
      - >-
        `VoltageControlledGenerator` models PV buses, `PowerShunt` capacitor banks and reactors
      - >-
        Lines flagged `backup=True` become switchable through `controllable_backup_lines`
    snippet: ''
    api:
      - monee.model.Bus
      - monee.model.PowerLine
      - monee.model.Trafo
      - monee.model.GenericPowerBranch
      - monee.model.ExtPowerGrid
      - monee.model.PowerLoad
      - monee.model.PowerGenerator
      - monee.model.VoltageControlledGenerator
      - monee.model.PowerShunt
      - monee.express.create_line
      - monee.express.create_trafo
      - monee.express.create_power_generator
      - monee.EL_NLP_FORMULATION
    keywords: [bus, line, cable, transformer, load, generator, PV bus, shunt, AC power flow, slack,
      loading, losses]
    related: [energy-flow, ac-opf, misocp-relaxation, operating-limits, matpower-import, backup-lines]
    docs:
