    short: Formulations
    level: core
    carriers: [all]
    tagline: >-
      Pick the equations per solve, from smooth NLP to exact quadratic, per carrier or network-wide.
    details: >-
      The formulation is a solve parameter: pass `formulation="smooth_nlp"`, `"convex_miqcqp"`,
      `"nonconvex_miqcqp"`, a sector key such as `"el_misocp"`, or a tuple merged left to right.
      Resolution runs from a per-component pin, to the solve argument, to `Network.apply_formulation`,
      to `DEFAULT_SIMULATION_FORMULATION`. The smooth gas and heat formulations take `friction_model`
      (`constant`, `hybrid`, `pwl` or `nonlinear`), and every option except `constant` resolves
      laminar flow in lightly loaded pipes.
