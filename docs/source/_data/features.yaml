  - id: storage
    group: horizon
    title: Storage
    short: Storage
    level: core
    carriers: [electricity, gas, heat]
    tagline: >-
      Batteries, gas stores and hot-water tanks that track their state of charge over time.
    details: >-
      `ElectricStorage` tracks energy in MWh, while `GasStorage` and `ThermalStorage` track stored
      mass in kg, with a standing loss on the thermal tank. All three attach as children and follow
      the load convention, so positive dispatch charges. `run_timeseries` replays a prescribed
      schedule and carries the state from step to step; optimized dispatch couples periods, so
      it runs through `OptimizationProblem.controllable_storages` and `run_multi_period`.
    highlights:
      - >-
        Charge and discharge efficiencies on batteries and gas stores model round-trip losses
      - '`loss_factor_per_h` models the standing loss of a thermal tank'
      - >-
        A `terminal_state` entry on `e_mwh` stops the optimizer from selling the starting charge
      - >-
        Economic dispatch with `include_storages=True` dispatches batteries, and gas stores when
        gas is dispatched
