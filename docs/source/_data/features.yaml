  - id: economic-dispatch
    group: optimize
    title: Economic dispatch
    short: Dispatch
    level: core
    carriers: [all]
    tagline: >-
      Minimize the cost of supplying power, gas and heat under full network limits.
    details: >-
      `create_economic_dispatch_problem` chooses generator output at minimum cost while voltage
      and line loading limits hold, and prices the external grid exchange when `ext_grid_cost_default`
      is set. `gas_cost_default` and `heat_cost_default` add gas sources and heat units, and once
      every carrier of a coupling unit is dispatched its regulation becomes a decision, so the
      merit order across carriers follows from the optimum. `ramp_limit` couples consecutive periods,
      and `include_storages` dispatches storages over a `run_multi_period` or `run_mpc` horizon.
    highlights:
      - >-
        `cost=` on generators, external grids, gas sources and heat units sets each price
      - Runs on the default AC formulation with IPOPT, no setup
      - Heat from a district heating plant is priced from its island heat balance
      - 'Prices are per MW and period: multiply an hourly price by `dt_h`'
    snippet: |-
      import monee
      from monee.problem import create_economic_dispatch_problem

      problem = create_economic_dispatch_problem(ext_grid_cost_default=25, gas_cost_default=30)
      result = monee.run_energy_flow_optimization(net, problem)
    api:
