  - id: ramp-limits
    group: horizon
    title: Ramp limits and period rules
    short: Ramps
    level: advanced
    carriers: [all]
    tagline: Bound changes between periods and apply constraints only in chosen periods.
    details: >-
      `ramp_limit` on the economic dispatch bounds the MW change of generators, gas sources and
      heat units, and `Constraints.regulation_ramp` limits every regulation decision, which covers
      coupling units. `temporal_equation` adds any cross-period rule to selected components without
      writing a model class, and `when_period` restricts a constraint to chosen periods of a `run_multi_period`
      horizon, for example a maintenance outage. Under `run_multi_period` these rows bind with
      foresight; under `run_timeseries` only against the step just solved.
    highlights:
      - Per-carrier ramp limits for power, gas and heat
      - '`regulation_ramp_limit` does the same in load shedding'
      - The first period is free unless `initial_state` gives the previous value
    snippet: |-
      from monee.problem import create_economic_dispatch_problem
      from monee.simulation import run_multi_period

      problem = create_economic_dispatch_problem(ext_grid_cost_default=30, ramp_limit=1.0)
      problem.constraints.regulation_ramp(0.5)
      result = run_multi_period(net, td, optimization_problem=problem)
    api:
      - monee.problem.Constraints.regulation_ramp
      - monee.problem.core.Constraint.temporal_equation
      - monee.problem.core.Constraint.when_period
