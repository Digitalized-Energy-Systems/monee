  - id: infeasibility-diagnosis
    group: analyze
    title: Infeasibility diagnosis
    short: Diagnosis
    level: advanced
    carriers: [all]
    tagline: >-
      Turn a failed solve into a structured report that names the components behind it.
    details: >-
      A failed Pyomo solve attaches an `InfeasibilityReport` with constraint residuals, bound
      violations, active bounds, a minimal infeasible subsystem when one can be isolated and violation
      hotspots ranked per component. A failed CasADi solve returns `success=False` with a `CasADiFailureReport`
      whose `numerics_failure` flag separates a solver breakdown from a verdict about the model,
      gurobipy attaches Gurobi's IIS as a `GurobiIISReport`, and GEKKO raises `GekkoSolveError`
      with a parsed APMonitor report. Every report sits on `result.infeasibility_report` or on
      the raised error and prints with `summary()`.
    highlights:
      - Solver variable names are translated back to component names
      - Pyomo residuals are grouped by carrier and collapsed into hotspots
      - On CasADi the input network stays untouched by a failed solve
      - '`diagnose_infeasibility` and `compute_mis` work on a Pyomo model directly'
    snippet: |-
      result = monee.run_energy_flow_optimization(net, problem, solver="scip")
      if not result.success:
          report = result.infeasibility_report
          print(report.summary(max_items=10))
          for spot in report.violation_hotspots(limit=5):
              print(spot["component"], spot["count"], spot["max_residual"])
