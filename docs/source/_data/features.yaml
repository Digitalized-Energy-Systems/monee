    title: Node-based couplers
    short: HG couplers
    level: advanced
    carriers: [electricity, gas, heat]
    tagline: Lightweight CHP, P2H and G2H variants that inject heat at one junction.
    details: >-
      `create_chp_hg`, `create_p2h_hg` and `create_g2h_hg` inject heat directly at a single water
      junction instead of through an internal exchanger across a supply and return pair, so they
      need neither a return junction nor an exchanger diameter. `CHPHG` stays a compound with
      a control node, while `PowerToHeatHG` and `GasToHeatHG` are plain branches. The McCormick
      heating formulation and networks generated with node-based heat loads require them.
    highlights:
      - No return junction and no exchanger diameter
      - Required with `HEAT_CONVEX_MILP_FORMULATION`
      - '`use_hg_variants` selects them in `create_coupling_points_for_mes`'
      - Downstream of a heat plant they push the supply above its setpoint
    snippet: |-
      mx.create_chp_hg(net, power_node_id=bus, heat_node_id=j_heat, gas_node_id=j_gas,
                       efficiency_power=0.35, efficiency_heat=0.45,
                       mass_flow_setpoint_kgs=0.01)
      mx.create_p2h_hg(net, power_node_id=bus, heat_node_id=j_heat,
                       heat_energy_mw=0.2, efficiency=0.95)
