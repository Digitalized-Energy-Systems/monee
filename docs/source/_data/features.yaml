  - id: network-aspects
    group: extend
    title: Network aspects
    short: Aspects
    level: advanced
    carriers: [all]
    tagline: >-
      Plug network-wide variables and equations into every solver without touching model classes.
    details: >-
      A `NetworkAspect` adds variables and equations across the whole network; it is the mechanism
      behind islanding, gas linepack and lumped thermal capacitance. Subclasses override only
      the phases they need: `prepare` (add `Var`s before injection), `equations`, `activate_timeseries`
      and the temporal hooks. Register one with `network.add_extension`; aspects compose and stay
      active in single-step, timeseries and multi-period solves, but the native format does not
      save them.
    highlights:
      - Four phases, each a no-op by default
      - Several aspects compose, each on its own variables
      - Works in single-step, timeseries and multi-period solves
      - Not stored by the native format, so register again after loading
    snippet: |-
      import monee.model as mm
      from monee import NetworkAspect

      class PressureFloor(NetworkAspect):
          def equations(self, network, ignored_nodes):
              return [n.model.pressure_squared_pu >= 0.81 for n in network.nodes
                      if isinstance(n.grid, mm.GasGrid) and n.id not in ignored_nodes
                      and not isinstance(n.model.pressure_squared_pu, float)]

      net.add_extension(PressureFloor())
    api:
      - monee.NetworkAspect
      - monee.model.Network.add_extension
      - monee.model.extension.core.NetworkAspect.prepare
      - monee.model.extension.core.NetworkAspect.equations
      - monee.model.extension.core.NetworkAspect.activate_timeseries
    keywords: [NetworkAspect, plug-in, extension, add_extension, network-wide, custom variables,
      custom constraints, prepare, activate_timeseries]
    related: [temporal-coupling, gas-linepack, thermal-inertia, islanding, custom-models]
    docs:
      - doc: concepts/network_aspects
        section: ''
        label: Network aspects
        kind: concept
      - doc: concepts/network_aspects
        section: Minimal example
        label: Write your own aspect
        kind: concept
      - doc: concepts/network_aspects
        section: Temporal phases in detail
        label: Temporal phases
        kind: concept
      - doc: concepts/network_aspects
        section: Registering an aspect
        label: Registering an aspect
        kind: concept
      - doc: components/extensions
        section: Network aspects
        label: Built-in aspects reference
        kind: component
      - doc: api/monee.model.extension
        section: Base
        label: NetworkAspect API
        kind: api

  - id: temporal-coupling
    group: extend
    title: Temporal coupling
    short: Inter-temporal
    level: advanced
    carriers: [all]
    tagline: >-
      One `inter_temporal_equations` method couples timeseries steps and multi-period horizons
      alike.
    details: >-
      Any model or aspect can implement `inter_temporal_equations` to tie a step to earlier ones,
      for storage state, ramp limits or thermal mass. `temporal_state.get` returns the previous
      solved float in `run_timeseries` (`StepState`) and a live solver variable in `run_multi_period`
      (`PeriodState`), so the same code works for sequential steps and for a joint horizon. `inter_step_equations`
      runs in timeseries only and `inter_period_equations` in multi-period only.
    highlights:
      - Look back further with `get(..., step=-2)` or an absolute step index
      - >-
        In a timeseries, a constraint over prescribed values only is dropped and reported as a
        temporal warning
      - >-
        `strict=True` on `run_timeseries` turns that warning into a `ValidationError`
    snippet: |-
      def inter_temporal_equations(self, temporal_state, component_id, **kwargs):
          prev_p = temporal_state.get(component_id, "p_mw")
          if prev_p is None:
              return []
          return [self.p_mw - prev_p <= self.ramp_up, prev_p - self.p_mw <= self.ramp_down]
    api:
      - monee.simulation.StepState
      - monee.simulation.PeriodState
      - monee.simulation.step_state.InterStepState
      - monee.model.extension.core.NetworkAspect.inter_temporal_equations
    keywords: [inter_temporal_equations, inter_step_equations, inter_period_equations, StepState,
      PeriodState, ramp rate, state of charge, look-back, custom dynamics]
    related: [ramp-limits, custom-models, network-aspects, multi-period, timeseries, storage]
    docs:
      - doc: concepts/timeseries
        section: Three temporal hooks
        label: Three temporal hooks
        kind: concept
      - doc: concepts/timeseries
        section: Implementing dynamics
        label: Implementing dynamics
        kind: concept
      - doc: how-to/timeseries
