        section: ''
        label: Gas components
        kind: component
      - doc: concepts/domains
        section: Weymouth pipe flow
        label: Weymouth pipe flow
        kind: concept
      - doc: concepts/domains
        section: Friction models
        label: Friction models
        kind: concept
      - doc: components/gas
        section: GasCompressor
        label: Compressor reference
        kind: component
      - doc: api/monee.model.phys
        section: Gas flow (Weymouth)
        label: Weymouth physics API
        kind: api

  - id: district-heating
    group: model
    title: District heating
    short: Heat
    level: core
    carriers: [heat]
    tagline: >-
      Insulated water pipes with temperature propagation, heat exchangers and nodal heat units.
    details: >-
      `WaterPipe` solves the Darcy-Weisbach pressure drop and carries temperature from inlet to
      outlet, losing heat through its insulation to the ambient. Fixed-flow heat exchangers drive
      their own design flow (a 30 K spread by default), passive exchangers follow the surrounding
      hydraulics, and `HeatGenerator` and `HeatLoad` add heat straight to a junction balance.
      Heat-exchanger consumers follow part-load profiles through regulation (variable flow) or
      `q_mw_set` (constant flow).
    highlights:
      - Darcy-Weisbach hydraulics with temperature upwinding and insulation losses
      - >-
        Fixed-flow exchangers for plants, passive exchangers for consumers on coupler loops
      - Nodal `HeatGenerator` and `HeatLoad` without a mass flow of their own
      - >-
        Agrees with pandapipes to about 0.1 percent on pressure and 0.01 K on temperature
    snippet: ''
    api:
      - monee.model.WaterPipe
      - monee.model.HeatExchanger
      - monee.model.PassiveHeatExchanger
      - monee.model.HeatGenerator
      - monee.model.HeatLoad
      - monee.model.ConsumeHydrGrid
      - monee.express.create_water_junction
      - monee.express.create_water_pipe
      - monee.express.create_heat_exchanger
      - monee.express.create_passive_heat_exchanger
      - monee.express.create_heat_generator
      - monee.express.create_heat_load
    keywords: [district heating, water pipe, Darcy-Weisbach, temperature, heat loss, heat exchanger,
      substation, heat demand, part load]
    related: [heat-loops, power-to-heat, thermal-inertia, mccormick-heat, topology-structures]
    docs:
