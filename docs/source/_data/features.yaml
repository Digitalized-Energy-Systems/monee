  - id: backup-lines
    group: optimize
    title: Backup line switching
    short: Backup lines
    level: advanced
    carriers: [electricity]
    tagline: >-
      Let the optimizer close normally open reserve lines to restore supply after a fault.
    details: >-
      Flag an electricity line with `backup=True`, usually together with `on_off=0` so it is built
      open. `controllable_backup_lines` turns the `on_off` of every flagged line into a binary
      decision, and the minimum load shedding problem does this on its own, closing a reserve
      line whenever that reduces curtailment. The binaries need a mixed-integer solver such as
      SCIP or Gurobi, since IPOPT relaxes them to fractions.
    highlights:
      - >-
        `backup=True` on `PowerLine` or `GenericPowerBranch` marks a reserve; the flag alone changes
        nothing
      - >-
        `OptimizationProblem.controllable_backup_lines` makes `on_off` a binary decision
      - >-
        The islanding branch gate only bounds a backup line from above, so closing it stays a
        decision
      - >-
        `create_monee_benchmark_net` ships two open backup lines, `create_mv_multi_cigre` one
    snippet: |-
      import monee
      import monee.model as mm

      net.branch(mm.PowerLine(500, 1e-4, 1e-4, 1, backup=True, on_off=0),
                 from_node_id=bus_a, to_node_id=bus_b)
      result = monee.solve_load_shedding_problem(net, solver="scip")
    api:
