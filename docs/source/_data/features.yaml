  - id: network-checks
    group: analyze
    title: Checks and strict mode
    short: Checks
    level: advanced
    carriers: [all]
    tagline: >-
      Lint a network before solving, flag suspicious results after, or raise in strict mode.
    details: >-
      `net.check()` runs cheap structural checks before any solve: a missing slack per carrier,
      heat-only dead-end junctions, non-transformer branches between buses of different `base_kv`
      and simulation variables that no equation pins; `mode="optimization"` skips that last check
      for a network headed into an optimization. After every successful solve monee attaches typed
      `ResultWarning` entries (`energy_balance`, `served_delta`, `relaxation`, `integrality`,
      `pruned`, `bound_active`, `dof`) to `result.warnings`. `strict=True` on any solve entry
      point raises `ValidationError` instead, which suits CI runs and published results.
    highlights:
      - >-
        Catches a carrier with no slack before the solve; islands cut off from their slack are reported
        afterwards as `pruned`
      - >-
        `result.violations` lists bound violations, `result.residuals` the largest equation residual
      - Noise floors keep solver tolerance out of the findings
      - >-
        Repeated finding profiles, such as every timeseries step, are counted instead of re-reported
    snippet: |-
      findings = net.check()
      try:
          result = monee.run_energy_flow(net, strict=True)
      except monee.ValidationError as e:
          print([w.category for w in e.warnings])
    api:
      - monee.model.Network.check
      - monee.model.network.CheckFinding
      - monee.ResultWarning
      - monee.ValidationError
    keywords: [lint, check, validation, strict, warnings, ValidationError, energy balance, CI,
