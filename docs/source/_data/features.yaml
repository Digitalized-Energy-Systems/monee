  - id: solver-backends
    group: solve
    title: Solver backends
    short: Backends
    level: core
    carriers: [all]
    tagline: >-
      Name a solver and monee routes the model to CasADi, GEKKO, Pyomo or gurobipy.
    details: >-
      monee uses IPOPT by default (via CasADi) and falls back to the IPOPT bundled with GEKKO
      when CasADi cannot be imported. The `solver=` name picks the backend: `apopt` and `bpopt`
      go to GEKKO, `gurobi` uses the native in-memory gurobipy backend when gurobipy is installed
      (Pyomo otherwise, and always for multi-period solves), other names such as `scip` go through
      Pyomo, and `backend=` forces a specific backend. Benchmarks show CasADi solving the smooth NLPs 3.5
      to 18 times faster than GEKKO and gurobipy solving conic and quadratic models 2 to 7 times
      faster than Gurobi through Pyomo.
    highlights:
      - Switching backends needs no change to the model code
      - >-
        A misspelt or missing Pyomo solver name raises a `ValueError` listing the installed ones
      - Solver objects can be built once and reused
      - On non-convex problems backends may stop at different local optima
    snippet: |-
      import monee

      result = monee.run_energy_flow(net, solver="scip")
