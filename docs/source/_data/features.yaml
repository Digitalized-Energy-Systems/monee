  - id: solver-tuning
    group: solve
    title: Solver options and warm starts
    short: Tuning
    level: advanced
    carriers: [all]
    tagline: >-
      Override gaps, time limits and IPOPT settings, and start each solve from the last solution.
    details: >-
      `run_energy_flow`, `run_energy_flow_optimization`, `run_timeseries` and the `Stepper` forward
      `solver_options` to the backend, the multi-period drivers do not; on Pyomo they merge over instance
      options and tuned presets, and a `None` value removes a preset key. The CasADi backend retries
      a failed IPOPT solve once with an adaptive barrier strategy. Each solve writes its solution
      back into the network so loops start warm, `run_timeseries` on CasADi builds the model once
      and re-solves it per step for a plain power flow driven by id-addressed series without hooks
      or extra solver options, and the `Stepper` switches IPOPT to warm-start options that roughly
      halve the time per step on the bundled multi-energy benchmark.
    highlights:
      - Presets such as a 300 second time limit and a 1e-4 gap for SCIP
      - '`copy=True` keeps the input network untouched'
      - >-
        On CIGRE MV, 12 timeseries steps on that build-once path ran 4.4 times faster than 12 separate
        calls
    snippet: |-
      result = monee.run_energy_flow_optimization(
          net, problem, solver="scip", solver_options={"limits/gap": 1e-3})
    api:
      - monee.run_energy_flow
      - monee.run_timeseries
      - monee.persist_solution
      - monee.solver.casadi.CasADiSolver.set_warm_start_hint
