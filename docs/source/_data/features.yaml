  - id: heat-loops
    group: couple
    title: Heating loops
    short: Loops
    level: advanced
    carriers: [heat]
    tagline: >-
      Supply and return loops fed by couplers, wired so they solve, with a capped backup heat source.
    details: >-
      A coupler with an internal exchanger needs a closed loop: plant reference on the cold side,
      coupler from cold to hot, consumers back to the reference. A water external grid pins pressure
      and temperature, which makes it an unlimited backup heat plant unless you cap it with `max_import_kgs`
      or bound it in the problem. When a fixed-flow consumer shares the loop with a coupler, add
      a bypass pipe or use a passive exchanger so the hydraulics are not over-determined.
    highlights:
      - With a coupler as the heat source, put the reference on the return side
      - >-
        Beside a plant that pins the supply temperature, couplers act as feed-in stations
      - A bypass pipe absorbs the flow mismatch on every backend
      - Cap the heat slack, or a resilience study reports zero heat curtailment
    snippet: |-
      mx.create_water_ext_grid(net, j_return, t_k=330, max_import_kgs=10.0)
      mx.create_heat_exchanger(net, j_supply, j_return, q_mw=0.5)
      mx.create_water_pipe(net, j_supply, j_return, diameter_m=0.15, length_m=50)
    api:
