      component ordering exactly. `include_solve_state=True` checkpoints the solved operating
      point, and `network_to_native_dict` and `native_dict_to_network` keep the format in memory.
      Custom models round-trip once registered with `@mm.model`; extensions, custom constraints
      and objectives and non-default formulations are not stored, so re-apply them after loading.
