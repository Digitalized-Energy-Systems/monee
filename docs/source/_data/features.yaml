        section: ''
        label: Electricity components
        kind: component
      - doc: concepts/domains
        section: AC power flow
        label: AC power-flow equations
        kind: concept
      - doc: components/electricity
        section: Trafo
        label: Transformer reference
        kind: component
      - doc: components/electricity
        section: VoltageControlledGenerator
        label: PV bus reference
        kind: component
