  - id: topology-structures
    group: build
    title: Topology structures
    short: Structures
    level: advanced
    carriers: [all]
    tagline: >-
      Build lines, rings, stars and paired district heating loops with one call per shape.
    details: >-
      `el_structure`, `gas_structure` and `water_structure` return builders that remember carrier
      defaults such as impedance or diameter, so each line, ring or star is one call that can
      attach a load to every new node. `dhs_structure` mirrors each shape on a supply and a return
      network, bridges the node pairs with heat exchangers and closes the loop with `attach_heat_plant`.
      Shapes return `Segment` handles that list the created ids and compose through `start_from`.
    highlights:
      - '`line`, `ring` and `star` shapes for electricity, gas and water'
      - Load keywords attach a load, sink, source or generator to every new node
      - '`heat_exchanger_q_mw` puts one consumer on each supply and return pair'
      - >-
        `attach_heat_plant` closes the loop with a supply slack at the feed temperature
    snippet: |-
      import monee.express as mx

      net = mx.create_multi_energy_network()
      s = mx.el_structure(net, length_m=100, r_ohm_per_m=7e-5, x_ohm_per_m=7e-5)
      seg = s.line(5, load_p_mw=0.1)
      s.attach_ext_grid(seg.first)
