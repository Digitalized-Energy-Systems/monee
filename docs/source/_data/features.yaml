  - id: conventions
    group: analyze
    title: Sign conventions
    short: Signs
    level: core
    carriers: [all]
    tagline: >-
      One load convention, unit-suffixed names and documented per-unit bases for every carrier.
    details: >-
      Positive means consumption and negative means generation for every child, slack and storage;
      generator constructors take positive magnitudes and store them negative. Attribute suffixes
      carry units (`_mw`, `_mvar`, `_kgs`, `_pu`, `_k`, `_mwh`), and the conventions page collects
      the bases and the sign rules of power and hydraulic branches. Getting the slack sign right
      is what makes import caps and import prices behave.
    highlights:
      - An external grid reports an import as negative `p_mw`
      - An import cap reads `p_mw >= -cap`, an import price `-price * p_mw`
      - The served value is the setpoint times regulation
      - '`dt_h` is always in hours, and a timestamp closes the interval it labels'
    snippet: ''
