  - id: rolling-mpc
    group: horizon
    title: Rolling-horizon MPC
    short: MPC
    level: advanced
    carriers: [all]
    tagline: >-
      Re-optimize a short look-ahead window, execute its first steps and roll forward.
    details: >-
      `run_mpc` solves a multi-period problem over `horizon` periods, keeps the first `execution_steps`,
      reseeds the initial state from the executed periods and advances until `total_steps` are
      covered. Storage state stays continuous across window boundaries. The returned objective
      sums the windows and overcounts when `execution_steps` is below `horizon`, and a `terminal_state`
      anchors only the final window.
    highlights:
      - '`execution_steps=1` is closest to online MPC'
      - A larger `execution_steps` re-solves less often and costs less
      - Returns a `MultiPeriodResult` over the executed steps
    snippet: |-
      from monee import run_mpc

      result = run_mpc(net, td_24h, total_steps=24, horizon=6, execution_steps=1,
                       optimization_problem=prob, dt_h=1.0)
    api:
      - monee.run_mpc
      - monee.MultiPeriodResult
    keywords: [MPC, model predictive control, rolling horizon, receding horizon, look-ahead, real-time
        dispatch]
    related: [multi-period, storage, stepper, profiles-and-prices]
