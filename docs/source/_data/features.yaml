  - id: gas-network
    group: model
    title: Gas network
    short: Gas
    level: core
    carriers: [gas]
    tagline: >-
      Junctions, Weymouth pipes, compressors, sources and sinks with pressure in per unit.
    details: >-
      Gas junctions solve squared pressure in per unit of the grid reference, and `GasPipe` applies
      the Weymouth equation with a friction factor from diameter and roughness and a flow cap
      from the erosional velocity. `GasCompressor` enforces a fixed pressure ratio with one-way
      flow, and `ExtHydrGrid`, `Source` and `Sink` feed and draw gas. Selectable friction models
      capture laminar flow in lightly loaded pipes.
    highlights:
      - >-
        Weymouth flow in squared per-unit pressure, reporting mass flow, velocity and density
      - Compressors with a fixed pressure ratio and a flow cap
      - >-
        Friction models: `constant`, `hybrid`, `pwl` or `nonlinear` for laminar and turbulent
        flow
      - Pressures agree with pandapipes within 1.2 percent of the pipe drop
    snippet: ''
    api:
      - monee.model.Junction
      - monee.model.GasPipe
      - monee.model.GasCompressor
      - monee.model.ExtHydrGrid
      - monee.model.Source
      - monee.model.Sink
      - monee.express.create_gas_junction
      - monee.express.create_gas_pipe
      - monee.express.create_compressor
      - monee.express.create_gas_ext_grid
      - monee.express.create_gas_source
      - monee.express.create_gas_sink
      - monee.model.formulation.make_gas_nlp_formulation
    keywords: [gas, pipeline, Weymouth, pressure, compressor, friction, roughness, mass flow,
      laminar, velocity]
    related: [carrier-grids, gas-linepack, power-gas-links, chp, formulations]
    docs:
