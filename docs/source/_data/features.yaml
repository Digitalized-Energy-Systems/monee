    details: >-
      Models with binaries or conic and quadratic structure, such as islanding, reserve line switching,
      MISOCP and the MIQCQP formulations, need a solver that branches on integers; the recommended
      ones are SCIP (open source) and Gurobi (commercial). Local solvers such as IPOPT can stop
      at a feasible point that is not optimal while reporting success. SCIP on `formulation="nonconvex_miqcqp"`
      runs spatial branch and bound and proves optimality up to its gap, and `solver_options`
      such as `numerics/feastol` and `limits/time` tune it.
    highlights:
      - >-
        `solver="scip"` routes through Pyomo; `solver="gurobi"` uses gurobipy when it is installed
      - >-
        IPOPT treats integer decisions as continuous and warns only for flow direction binaries
      - A relaxation bound grades a local solution
    snippet: |-
      result = monee.run_energy_flow_optimization(
          net, problem, solver="scip", formulation="nonconvex_miqcqp")
