  - id: auto-fallback
    group: solve
    title: Automatic solver fallback
    short: Auto
    level: advanced
    carriers: [all]
    tagline: >-
      With `solver="auto"`, a numerics failure is retried once on SCIP so sweeps keep running.
    details: >-
      A failed solve on CasADi, Pyomo or gurobipy returns `success=False` instead of raising,
      so sweep loops can branch on `result.success`. `solver="auto"` runs the default IPOPT backend
      and retries on SCIP only after a numerics failure such as `Restoration_Failed`; a proven
      infeasibility or a badly posed model returns at once. The result records `backend_used`
      and `fallback_from` and gains a `backend_fallback` warning; it works with `run_energy_flow`,
      `run_timeseries` and the `Stepper`.
    highlights:
      - Suits contingency screening, Monte Carlo and parameter sweeps
      - '`is_numerics_failure` separates a solver breakdown from an infeasible model'
      - Single-period only, rejected by `run_multi_period`
      - '`solver_options` are not forwarded to the SCIP retry'
    snippet: |-
      result = monee.run_energy_flow(net, solver="auto")
      print(result.success, result.backend_used, result.fallback_from)
    api:
      - monee.solver.AutoSolver
      - monee.solver.casadi.is_numerics_failure
      - monee.run_energy_flow
    keywords: [auto, fallback, retry, robustness, sweep, contingency, Monte Carlo, Restoration_Failed]
