    details: >-
      Both built-in problems bound bus voltages and line loading (apparent power against `max_s_mva`,
      otherwise current against `max_i_ka`), keep gas pressures and water temperatures in their
      bands, and honour external grid caps such as `max_import_mw` or `max_import_kgs` unless
      a problem-level exchange bound replaces them. `OptimizationProblem.bounds` overrides the
      band of selected variables, for example the squared pressure of chosen gas junctions. Comparing
      solves with and without a limit gives its congestion cost, and relaxing it slightly gives
      the value of one more MW.
    highlights:
