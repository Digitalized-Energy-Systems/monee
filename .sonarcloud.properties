# SonarQube Cloud Automatic Analysis reads THIS file; it ignores
# sonar-project.properties. Paths are relative to the repository root.

# Analyse only the library sources.
sonar.sources=src

# Keep the benchmark scripts, the test suite and the docs out of analysis.
# Set on both the main and test scopes so auto-detected test files are excluded too.
sonar.exclusions=benchmarks/**,tests/**,docs/**
sonar.test.exclusions=benchmarks/**,tests/**,docs/**

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# python specifics
sonar.python.version=3.10, 3.11, 3.12, 3.13
